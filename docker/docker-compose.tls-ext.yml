# ── Variante "Traefik externe" (HTTPS + WSS passthrough) ────────────────────
# Utilisez ce fichier si Traefik est déjà en cours d'exécution sur votre serveur.
#
# Prérequis :
#   1. Créer le réseau Docker partagé avec Traefik (une seule fois) :
#        docker network create traefik
#      (adapter le nom ci-dessous si votre réseau s'appelle autrement)
#   2. Dans votre Traefik existant, activer la découverte Docker sur ce réseau :
#        providers.docker.network = traefik
#   3. Adapter les labels 'certresolver' au nom de votre resolver Let's Encrypt
#      (deux resolvers attendus : un RSA, un ECDSA — adapter leurs noms)
#   4. Adapter le bind mount des cert-dumpers vers le dossier acme de votre Traefik
#      (les fichiers acme-rsa.json et acme-ecdsa.json doivent s'y trouver)

services:

  # ── Application OCPP CP Admin ──────────────────────────────
  ocpp-cp-admin:
    image: ghcr.io/wocha-fr/ocpp-cp-admin:latest
    container_name: ocpp-cp-admin
    restart: unless-stopped
    depends_on:
      ftp:
        condition: service_started
      cert-dumper-rsa:
        condition: service_healthy
      cert-dumper-ecdsa:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
    volumes:
      - ./data/config:/app/config
      - ./data/logs:/app/logs
      # Uncomment the following line to enable image uploads (e.g. for custom favicon and logos)
      #- ./data/public-img:/app/public/img
      # Uncomment the following line to enable custom locales (for translations)
      #- ./data/locales-custom:/app/locales-custom
    networks:
      - default  # communication avec les autres services
      - traefik  # découverte par le Traefik externe
    environment:
      - NODE_ENV=production
      # Décommenter pour afficher les logs en console (debug temporaire uniquement)
      # - LOG_CONSOLE=true

      # ── Déploiement / URLs ──────────────────────────────────
      - CPADMIN_HTTP_HOST=0.0.0.0
      - CPADMIN_TRUST_PROXY=true
      # URL publique HTTPS (utilisée pour les liens dans les notifications)
      - CPADMIN_PUBLIC_URL=https://cpadmin.local
      # URL WebSocket OCPP non chiffré (bornes sans TLS, via Traefik port 80)
      - CPADMIN_OCPP_WS_URL=ws://ws.cpadmin.local
      # URL WebSocket OCPP chiffré, TLS géré par l'app (TCP passthrough, Security Profile 2/3)
      - CPADMIN_OCPP_WSS_URL=wss://ws.cpadmin.local

      # ── Diagnostics FTP ─────────────────────────────────────
      # URL FTP où les bornes déposent leurs fichiers de diagnostic
      - CPADMIN_DIAGNOSTICS_URL=ftp://ftp.cpadmin.local

      # ── Sécurité ────────────────────────────────────────────
      # IMPORTANT : changer cette valeur (min. 32 caractères aléatoires)
      - CPADMIN_SESSION_SECRET=change-me-with-a-random-secret

      # ── Activation des fonctionnalités ──────────────────────
      # TLS OCPP géré par l'app (TCP passthrough Traefik)
      - CPADMIN_OCPP_WSS_ENABLED=true
      # UI en HTTP interne — HTTPS terminé par Traefik, ne pas activer ici
      # - CPADMIN_WEBUI_HTTPS_ENABLED=true

      # ── Comportement OCPP ───────────────────────────────────
      # - CPADMIN_OCPP_V16_ENABLED=true
      # - CPADMIN_OCPP_V201_ENABLED=false
      - CPADMIN_OCPP_STRICT_MODE=false
      - CPADMIN_OCPP_AUTO_ADD=true
      - CPADMIN_OCPP_PENDING_UNKNOWN=false

      # ── Configuration générale ──────────────────────────────
      # Niveau de log : error | warn | info | debug
      - CPADMIN_LOGLEVEL=info
      # - CPADMIN_LANGUAGE=fr
      # - CPADMIN_CPO_NAME=Mon CPO

      # ── Notifications e-mail (optionnel) ────────────────────
      # - CPADMIN_MAIL_ENABLED=true
      # - CPADMIN_MAIL_HOST=smtp.example.com
      # - CPADMIN_MAIL_PORT=587
      # - CPADMIN_MAIL_SECURE=false
      # - CPADMIN_MAIL_USER=user@example.com
      # - CPADMIN_MAIL_PASS=password
      # - CPADMIN_MAIL_FROM=noreply@cpadmin.local

      # ── Notifications Web Push (optionnel) ──────────────────
      # - CPADMIN_WEBPUSH_ENABLED=true
      # - CPADMIN_VAPID_SUBJECT=mailto:admin@cpadmin.local
      # - CPADMIN_VAPID_PUBLIC_KEY=
      # - CPADMIN_VAPID_PRIVATE_KEY=

      # ── Notifications Pushover (optionnel) ──────────────────
      # - CPADMIN_PUSHOVER_ENABLED=true

      # ── Authentification Google OAuth (optionnel) ───────────
      # - CPADMIN_GOOGLE_AUTH_ENABLED=true
      # - CPADMIN_GOOGLE_CLIENT_ID=
      # - CPADMIN_GOOGLE_CLIENT_SECRET=
    labels:
      - "traefik.enable=true"
      # ── UI HTTP → HTTPS redirect ──
      - "traefik.http.routers.ui-http.rule=Host(`cpadmin.local`)"
      - "traefik.http.routers.ui-http.entrypoints=web"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"
      - "traefik.http.routers.ui-http.middlewares=redirect-https"
      - "traefik.http.routers.ui-http.service=noop@internal"
      # ── UI HTTPS — cert RSA (+ ws.cpadmin.local en SAN) ──
      - "traefik.http.routers.ui.priority=20"
      - "traefik.http.routers.ui.rule=Host(`cpadmin.local`)"
      - "traefik.http.routers.ui.entrypoints=websecure"
      - "traefik.http.routers.ui.tls=true"
      # Adapter 'letsencrypt-rsa' au nom du certresolver RSA de votre Traefik existant
      - "traefik.http.routers.ui.tls.certresolver=letsencrypt-rsa"
      - "traefik.http.routers.ui.tls.domains[0].main=cpadmin.local"
      - "traefik.http.routers.ui.tls.domains[0].sans=ws.cpadmin.local"
      - "traefik.http.routers.ui.service=ui"
      - "traefik.http.services.ui.loadbalancer.server.port=3000"
      # ── OCPP WS (HTTP, bornes sans TLS) ──
      - "traefik.http.routers.ocpp-ws.rule=Host(`ws.cpadmin.local`)"
      - "traefik.http.routers.ocpp-ws.entrypoints=web"
      - "traefik.http.routers.ocpp-ws.service=ocpp-ws"
      - "traefik.http.services.ocpp-ws.loadbalancer.server.port=9000"
      # ── Déclencheur cert ECDSA (cpadmin.local + SAN ws.cpadmin.local) ──
      # Priorité 1 < ui (20) : ne prend jamais le trafic, déclenche uniquement la génération ECDSA.
      # Nécessaire car le TCP passthrough intercepte ws.cpadmin.local:443 avant tout routeur HTTP.
      - "traefik.http.routers.ui-ecdsa.rule=Host(`cpadmin.local`)"
      - "traefik.http.routers.ui-ecdsa.entrypoints=websecure"
      - "traefik.http.routers.ui-ecdsa.tls=true"
      # Adapter 'letsencrypt-ecdsa' au nom du certresolver ECDSA de votre Traefik existant
      - "traefik.http.routers.ui-ecdsa.tls.certresolver=letsencrypt-ecdsa"
      - "traefik.http.routers.ui-ecdsa.tls.domains[0].main=cpadmin.local"
      - "traefik.http.routers.ui-ecdsa.tls.domains[0].sans=ws.cpadmin.local"
      - "traefik.http.routers.ui-ecdsa.service=noop@internal"
      - "traefik.http.routers.ui-ecdsa.priority=1"
      # ── OCPP WSS (TCP passthrough — TLS géré par l'app) ──
      - "traefik.tcp.routers.ocpp-wss.rule=HostSNI(`ws.cpadmin.local`)"
      - "traefik.tcp.routers.ocpp-wss.entrypoints=websecure"
      - "traefik.tcp.routers.ocpp-wss.tls.passthrough=true"
      - "traefik.tcp.routers.ocpp-wss.service=ocpp-wss"
      - "traefik.tcp.services.ocpp-wss.loadbalancer.server.port=9001"

  # ── Extraction des certificats Traefik → config/certs/ ─────
  # Surveille acme.json et copie les certs dès qu'ils sont émis ou renouvelés.
  cert-dumper-rsa:
    image: ldez/traefik-certs-dumper:v2.11.4
    container_name: ocpp-cert-dumper-rsa
    restart: unless-stopped
    volumes:
      # Adapter ce chemin vers le dossier letsencrypt de votre Traefik externe
      # (celui qui contient acme-rsa.json)
      # Ex. volume Docker nommé  : letsencrypt:/traefik:ro
      #   (ajouter alors en bas : volumes: { letsencrypt: { external: true } })
      - /opt/traefik/letsencrypt:/traefik:ro
      - ./data/config:/app/config
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        echo '#!/bin/sh' > /tmp/hook.sh
        echo 'cp /dump/certs/cpadmin.local.crt /app/config/certs/rsa-server.crt || true' >> /tmp/hook.sh
        echo 'cp /dump/private/cpadmin.local.key /app/config/certs/rsa-server.key || true' >> /tmp/hook.sh
        echo 'chmod 644 /app/config/certs/rsa-server.crt /app/config/certs/rsa-server.key || true' >> /tmp/hook.sh
        chmod +x /tmp/hook.sh
        mkdir -p /dump /app/config/certs
        traefik-certs-dumper file --version v3 --source /traefik/acme-rsa.json --dest /dump
        /tmp/hook.sh || true
        touch /tmp/cert-ready
        exec traefik-certs-dumper file --watch --version v3 --source /traefik/acme-rsa.json --dest /dump --post-hook /tmp/hook.sh
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/cert-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  cert-dumper-ecdsa:
    image: ldez/traefik-certs-dumper:v2.11.4
    container_name: ocpp-cert-dumper-ecdsa
    restart: unless-stopped
    volumes:
      # Adapter ce chemin vers le dossier letsencrypt de votre Traefik externe
      # (celui qui contient acme-ecdsa.json)
      # Ex. volume Docker nommé  : letsencrypt:/traefik:ro
      #   (ajouter alors en bas : volumes: { letsencrypt: { external: true } })
      - /opt/traefik/letsencrypt:/traefik:ro
      - ./data/config:/app/config
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        echo '#!/bin/sh' > /tmp/hook.sh
        echo 'cp /dump/certs/cpadmin.local.crt /app/config/certs/ecdsa-server.crt || true' >> /tmp/hook.sh
        echo 'cp /dump/private/cpadmin.local.key /app/config/certs/ecdsa-server.key || true' >> /tmp/hook.sh
        echo 'chmod 644 /app/config/certs/ecdsa-server.crt /app/config/certs/ecdsa-server.key || true' >> /tmp/hook.sh
        chmod +x /tmp/hook.sh
        mkdir -p /dump /app/config/certs
        traefik-certs-dumper file --version v3 --source /traefik/acme-ecdsa.json --dest /dump
        /tmp/hook.sh || true
        touch /tmp/cert-ready
        exec traefik-certs-dumper file --watch --version v3 --source /traefik/acme-ecdsa.json --dest /dump --post-hook /tmp/hook.sh
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/cert-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  # ── Initialisation CA + certificat client OCPP (Security Profile 3) ──────
  # One-shot : génère ca.crt + client.pem dans data/config/certs/ si absents.
  # Une fois généré, configurer config.json :
  #   wss.strictClientCert = true
  #   wss.caFile           = "certs/ca.crt"
  # Puis déposer client.pem sur chaque borne (contient cert + clé privée).
  cert-init:
    image: alpine:3
    container_name: ocpp-cert-init
    restart: "no"
    volumes:
      - ./data/config:/app/config
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl > /dev/null 2>&1
        CERTS=/app/config/certs
        mkdir -p $$CERTS

        if [ ! -f $$CERTS/ca.crt ]; then
          echo "[cert-init] Génération de la CA locale..."
          openssl req -x509 -newkey rsa:4096 -sha256 -days 3650 -nodes \
            -keyout $$CERTS/ca.key \
            -out    $$CERTS/ca.crt \
            -subj   "/CN=OCPP-CA"
          echo "[cert-init] CA créée."
        else
          echo "[cert-init] CA déjà présente, skip."
        fi

        if [ ! -f $$CERTS/client.pem ]; then
          echo "[cert-init] Génération du certificat client..."
          openssl req -newkey rsa:2048 -nodes \
            -keyout $$CERTS/client.key \
            -out    $$CERTS/client.csr \
            -subj   "/CN=ocpp-client"
          openssl x509 -req -days 365 -sha256 \
            -in          $$CERTS/client.csr \
            -CA          $$CERTS/ca.crt \
            -CAkey       $$CERTS/ca.key \
            -CAcreateserial \
            -out         $$CERTS/client.crt
          cat $$CERTS/client.crt $$CERTS/client.key > $$CERTS/client.pem
          rm  $$CERTS/client.csr $$CERTS/client.srl 2>/dev/null || true
          chmod 600 $$CERTS/ca.key $$CERTS/client.key $$CERTS/client.pem
          echo "[cert-init] Certificat client créé : client.pem"
        else
          echo "[cert-init] Certificat client déjà présent, skip."
        fi

        if [ ! -f $$CERTS/rsa-server.crt ] || [ ! -f $$CERTS/rsa-server.key ]; then
          echo "[cert-init] Génération d'un certificat serveur RSA temporaire (bootstrap)..."
          openssl req -x509 -newkey rsa:2048 -sha256 -days 7 -nodes \
            -keyout $$CERTS/rsa-server.key \
            -out    $$CERTS/rsa-server.crt \
            -subj   "/CN=bootstrap.local"
          chmod 644 $$CERTS/rsa-server.crt $$CERTS/rsa-server.key
        else
          echo "[cert-init] Certificat serveur RSA déjà présent, skip."
        fi

        if [ ! -f $$CERTS/ecdsa-server.crt ] || [ ! -f $$CERTS/ecdsa-server.key ]; then
          echo "[cert-init] Génération d'un certificat serveur ECDSA temporaire (bootstrap)..."
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -sha256 -days 7 -nodes \
            -keyout $$CERTS/ecdsa-server.key \
            -out    $$CERTS/ecdsa-server.crt \
            -subj   "/CN=bootstrap.local"
          chmod 644 $$CERTS/ecdsa-server.crt $$CERTS/ecdsa-server.key
        else
          echo "[cert-init] Certificat serveur ECDSA déjà présent, skip."
        fi

  # ── Serveur FTP pour les diagnostics de bornes ─────────────
  ftp:
    image: delfer/alpine-ftp-server
    container_name: ocpp-ftp
    restart: unless-stopped
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    environment:
      - USERS=ocpp|changeme
      - ADDRESS=ftp.cpadmin.local
      - MIN_PORT=21000
      - MAX_PORT=21010
      - ADDED_FLAGS= --dirlist_enable=NO --download_enable=NO --delete_enable=NO
    volumes:
      - ./data/ftp:/ftp/ocpp
    labels:
      - "traefik.enable=false"

networks:
  traefik:
    external: true
