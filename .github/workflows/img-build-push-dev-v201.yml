name: Build and push Container image (dev + feature-ocpp-201)

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'feature/**'
    tags:
      - 'v*'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          git fetch origin main
          if git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-amd64:
    needs: [check]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dev
          - variant: feature-ocpp-201
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Disable OCPP 2.0.1 code (dev variant)
        if: matrix.variant == 'dev'
        run: sed -i 's/if (config\.ocpp\.v201/\/\/ if (config.ocpp.v201/g' src/server.js

      - name: Login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GIT_PKGTOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push linux/amd64
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          context: .
          file: ./Dockerfile
          provenance: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            wocha/ocpp-cp-admin
            ghcr.io/wocha-fr/ocpp-cp-admin

      - name: Export digest
        run: |
          mkdir -p /tmp/digests-amd64-${{ matrix.variant }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests-amd64-${{ matrix.variant }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-amd64-${{ matrix.variant }}
          path: /tmp/digests-amd64-${{ matrix.variant }}/*
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    needs: [check]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dev
          - variant: feature-ocpp-201
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Disable OCPP 2.0.1 code (dev variant)
        if: matrix.variant == 'dev'
        run: sed -i 's/if (config\.ocpp\.v201/\/\/ if (config.ocpp.v201/g' src/server.js

      - name: Login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GIT_PKGTOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push linux/arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64
          context: .
          file: ./Dockerfile
          provenance: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            wocha/ocpp-cp-admin
            ghcr.io/wocha-fr/ocpp-cp-admin

      - name: Export digest
        run: |
          mkdir -p /tmp/digests-arm64-${{ matrix.variant }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests-arm64-${{ matrix.variant }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-arm64-${{ matrix.variant }}
          path: /tmp/digests-arm64-${{ matrix.variant }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [check, build-amd64, build-arm64]
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dev
          - variant: feature-ocpp-201
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-amd64-${{ matrix.variant }}
          path: /tmp/digests-amd64

      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-arm64-${{ matrix.variant }}
          path: /tmp/digests-arm64

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            wocha/ocpp-cp-admin
            ghcr.io/wocha-fr/ocpp-cp-admin
          tags: |
            # Variant dev → tags habituels
            type=ref,event=branch,enable=${{ matrix.variant == 'dev' }}
            type=raw,value={{branch}}-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.ref_type == 'branch' && matrix.variant == 'dev' }}
            type=semver,pattern={{version}},enable=${{ matrix.variant == 'dev' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.variant == 'dev' }}
            # Variant feature-ocpp-201 → tag fixe (uniquement depuis dev)
            type=raw,value=feature-ocpp-201,enable=${{ github.ref_name == 'dev' && matrix.variant == 'feature-ocpp-201' }}

      - name: Login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GIT_PKGTOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-arch manifest
        run: |
          TAGS_DH=$(jq -cr '.tags | map(select(startswith("wocha/")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ -z "$TAGS_DH" ]; then
            echo "No tags for this variant on this branch, skipping push"
            exit 0
          fi

          DIGEST_AMD64=$(ls /tmp/digests-amd64)
          DIGEST_ARM64=$(ls /tmp/digests-arm64)
          TAGS_GH=$(jq -cr '.tags | map(select(startswith("ghcr.io/")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          # DockerHub
          docker buildx imagetools create $TAGS_DH \
            wocha/ocpp-cp-admin@sha256:${DIGEST_AMD64} \
            wocha/ocpp-cp-admin@sha256:${DIGEST_ARM64}

          # GitHub Container Registry
          docker buildx imagetools create $TAGS_GH \
            ghcr.io/wocha-fr/ocpp-cp-admin@sha256:${DIGEST_AMD64} \
            ghcr.io/wocha-fr/ocpp-cp-admin@sha256:${DIGEST_ARM64}